[project]
name = "complens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.6", "scipy>=1.14", "matplotlib>=3.9", "joblib>=1.4", "optuna>=4.0", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.9", "PyYAML>=6", "shap>=0.46"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]
ops = ["dvc>=3", "wandb==0.19.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["ml*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"ml/evaluation/document.py" = ["E501"]
