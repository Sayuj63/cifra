services:
  - type: web
    name: complens-api
    runtime: python
    plan: free
    buildCommand: pip install . && python -m ml.data.generate && python -m ml.models.train --trials 3
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: COMPLENS_CORS_ORIGINS
        sync: false
